openapi: 3.1.0
info:
  title: URL Shortener API
  version: 1.0.0
  description: High-performance, production-ready URL Shortener REST API built with Go and PostgreSQL.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /api/v1/urls:
    post:
      summary: Create a short URL
      operationId: createShortURL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateURLRequest'
      responses:
        '201':
          description: Short URL created successfully
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URLResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
    get:
      summary: List short URLs with pagination
      operationId: listURLs
      parameters:
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of items to skip
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Paginated URL list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedURLResponse'

  /api/v1/urls/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get details for a short URL
      operationId: getURLByCode
      responses:
        '200':
          description: URL details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URLResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update the destination URL
      operationId: updateURL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateURLRequest'
      responses:
        '200':
          description: URL updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URLResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete a short URL
      operationId: deleteURL
      responses:
        '204':
          description: URL successfully deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/urls/{code}/stats:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get click analytics for a short URL
      operationId: getURLStats
      responses:
        '200':
          description: URL analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URLStatsResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /{code}:
    get:
      summary: Redirect to destination URL
      operationId: redirectToDestination
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '307':
          description: Temporary redirect to destination URL
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFoundError'

  /healthz:
    get:
      summary: Process liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Application is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time

  /readyz:
    get:
      summary: Service readiness probe (checks database connectivity)
      operationId: getReadiness
      responses:
        '200':
          description: Application is ready to receive traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  database:
                    type: string
                    example: connected
                  time:
                    type: string
                    format: date-time
        '503':
          description: Application is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not ready
                  database:
                    type: string
                    example: disconnected
                  error:
                    type: string
                  time:
                    type: string
                    format: date-time

components:
  schemas:
    CreateURLRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          example: https://github.com/golang/go
        custom_code:
          type: string
          pattern: '^[a-zA-Z0-9_-]{4,32}$'
          example: go-repo
    UpdateURLRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          example: https://go.dev
    URLResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: aB82xQ
        original_url:
          type: string
          format: uri
          example: https://github.com/golang/go
        short_url:
          type: string
          format: uri
          example: http://localhost:8080/aB82xQ
        clicks:
          type: integer
          example: 0
        last_accessed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaginatedURLResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/URLResponse'
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
    URLStatsResponse:
      type: object
      properties:
        code:
          type: string
        original_url:
          type: string
        clicks:
          type: integer
        last_accessed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            request_id:
              type: string

  responses:
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Conflict (e.g. code already exists)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimitedError:
      description: Rate Limit Exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
